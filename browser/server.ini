# Local development only; never point initDb at a production database.
server.host=127.0.0.1
server.port=22227
server.base=http://127.0.0.1:22227
server.base.dir=../browser
server.log.file=../browser/.runtime/server.log
server.log.folder=../browser/.runtime/logs
server.log.file.split=false
server.log.level=3
server.command.compression=false
server.test=true
server.spectator.cooldown=0
db.driver=org.h2.Driver
db.url=jdbc:h2:file:../browser/.runtime/ffb;MODE=MySQL;NON_KEYWORDS=VALUE;DB_CLOSE_ON_EXIT=FALSE
db.user=sa
db.password=
# Existing standalone SQL branch uses standard identity syntax, supported by H2.
db.type=mysql
timer.networkEntropy=0
timer.sessionTimeoutEnabled=false
