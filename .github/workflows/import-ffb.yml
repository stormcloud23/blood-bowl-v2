name: Import pinned FFB source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-ffb.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import source and retain browser changes
        shell: bash
        run: |
          set -euo pipefail
          baseline=bf3f89d96b5143a8730910a841e7430791094492
          git ls-files -z > "$RUNNER_TEMP/overlay-files"
          tar --null -T "$RUNNER_TEMP/overlay-files" -cf "$RUNNER_TEMP/browser-overlay.tar"
          git fetch --depth=1 https://github.com/christerk/ffb.git "$baseline"
          test "$(git rev-parse FETCH_HEAD)" = "$baseline"
          git read-tree FETCH_HEAD
          git checkout-index -a -f
          tar -xf "$RUNNER_TEMP/browser-overlay.tar"
          rm .github/workflows/import-ffb.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import pinned FFB source with browser prototype overlay'
          git push origin HEAD:main
